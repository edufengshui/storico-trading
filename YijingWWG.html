// Right pad a string to a certain length
function rpad(original_str, pad_width)
{
	var spaces = "                                                  ";
	
	if (original_str.length < pad_width)
		original_str = original_str + spaces.substring(0, pad_width - original_str.length);
		
	return original_str;
}

// Center a string in a certain length space
function center_string(original_str, total_width)
{
	var spaces = "                                                  ";

	if (original_str.length < total_width)
		original_str = spaces.substring(0, (total_width - original_str.length) / 2) + original_str;
			
	return rpad(original_str, total_width);
}

// Reverse a binary string by switching 0 to 1 and 1 to 0.
function reverse_binary(original_str)
{
	var reversed = ""
	
	for (var idx = 0; idx < original_str.length; ++idx)
		if (original_str.charAt(idx) == "0")
			reversed = reversed + "1";
		else
			reversed = reversed + "0";
			
	return reversed;
}

// Return the difference in number of days between two dates
function days_diff(date1, date2)
{
	var date_only1 = new Date(date1);
	var date_only2 = new Date(date2);

	// hours/minutes/seconds are ignored
	date_only1.setUTCHours(0);
	date_only1.setUTCMinutes(0);
	date_only1.setUTCSeconds(0);

	date_only2.setUTCHours(0);
	date_only2.setUTCMinutes(0);
	date_only2.setUTCSeconds(0);
	
	return Math.round((Math.abs(date_only2.valueOf() - date_only1.valueOf()) / ONE_DAY));
}


// Return the element of a branch
function get_branch_element(branch)
{
	for (var i = 0; i < 12; ++i)
		if (branch == branches[i][0])
			return branches[i][1];
}

// Return void branches given a stem and a branch.
// Return the string "Invalid" when the stem and branch combo is invalid.
function get_void_branches(stem, branch)
{
	var stem_idx, branch_idx;
	var days_till_next_Jia, void_branch1_idx;
	
	for (stem_idx = 0; stem_idx < 10; ++stem_idx)
		if (stem == stems[stem_idx][0])
			break;

	for (branch_idx = 0; branch_idx < 12; ++branch_idx)
		if (branch == branches[branch_idx][0])
			break;
			
	if (stem_idx % 2 != branch_idx % 2)
		return "Invalid";

	days_till_next_Jia = 10 - stem_idx;
	void_branch1_idx = (branch_idx + days_till_next_Jia) % 12;
	
	return branches[void_branch1_idx][0] + " & " + branches[void_branch1_idx + 1][0];
}

// Return the relations for a line branch given the palace element
function get_relation(palace_element, branch)
{
	var line_element = get_branch_element(branch)
	
	var distance = line_element - palace_element;
	
	if (distance < 0)
		distance = distance + 5;
		
	return relations[distance];
}

// Return the palace of a hexagram
function get_palace(hex_binary, j_line, returning_gua)
{
	var palace_binary;
	
	if (j_line == 1 || j_line == 2 || (j_line == 3 && !returning_gua))
		palace_binary = hex_binary.substring(3, 6);
	else if (j_line == 4 || j_line == 5)
		palace_binary = reverse_binary(hex_binary.substring(0, 3));
	else if (j_line == 6 || (j_line == 3 && returning_gua))
		palace_binary = hex_binary.substring(0, 3);
	
	palace_binary = palace_binary + palace_binary;
	
	for (var idx = 0; idx < 8; ++idx)
	{
		if (palace_binary == branch_assignments[idx][0])
			return idx;
	}
}

// Return the change string for a hexagram binary
function get_changes(hex_binary)
{
	var changes = "";

	if (hex_binary.charAt(0) == hex_binary.charAt(3))
		changes = changes + " ";
	else
		changes = changes + "C";
			
	if (hex_binary.charAt(1) == hex_binary.charAt(4))
		changes = changes + " ";
	else
		changes = changes + "C";

	if (hex_binary.charAt(2) == hex_binary.charAt(5))
		changes = changes + " ";
	else
		changes = changes + "C";
		
	return changes;
}

// Return if two branches combine with each other
function is_combine(branch1, branch2)
{
	for (i = 0; i < 2; ++i)
	{
		if (branch1 == "c" && branch2 == "z")
			return true;
		if (branch1 == "y" && branch2 == "h")
			return true;
		if (branch1 == "m" && branch2 == "xu")
			return true;
		if (branch1 == "cn" && branch2 == "yo")
			return true;
		if (branch1 == "si" && branch2 == "s")
			return true;
		if (branch1 == "w" && branch2 == "we")
			return true;
			
		// Swap the two branches and re-compare
		var dummy = branch2;
		branch2 = branch1;
		branch1 = dummy;
	}
	
	return false;
}

// Returns if two branches strike each other
function is_strike(branch1, branch2)
{
	for (i = 0; i < 2; ++i)
	{
		if (branch1 == "z" && branch2 == "w")
			return true;
		if (branch1 == "c" && branch2 == "we")
			return true;
		if (branch1 == "y" && branch2 == "s")
			return true;
		if (branch1 == "m" && branch2 == "yo")
			return true;
		if (branch1 == "cn" && branch2 == "xu")
			return true;
		if (branch1 == "si" && branch2 == "h")
			return true;
			
		// Swap the two branches and re-compare
		var dummy = branch2;
		branch2 = branch1;
		branch1 = dummy;
	}
		
	return false;
}

// Build the hexagram chart in a string
function build_chart(has_moving_lines, show_6_colors)
{
	var line_str;
	var chart_str;
	
	// Draw hexagram names and numbers
	chart_str = "      " + rpad(first_hex[0], 17);
	
	if (has_moving_lines)
		chart_str = chart_str + " " + second_hex[0];
	
	chart_str = chart_str + CRLF + CRLF;
	
	// Draw hexagram lines
	for (var line_idx = 6; line_idx >= 1; --line_idx)
	{
		// Draw first hexagram
		line_str = " ";
		line_str = line_str + rpad(first_hex[line_idx][FIRST_H_RELATION], 1) + " ";
		line_str = line_str + rpad(first_hex[line_idx][FIRST_H_BRANCH], 2) + " ";
		line_str = line_str + first_hex[line_idx][FIRST_RELATION] + " ";
		line_str = line_str + rpad(first_hex[line_idx][FIRST_BRANCH], 2) + " ";
		line_str = line_str + center_string(first_hex[line_idx][FIRST_LINE], 3) + " ";
		line_str = line_str + rpad(first_hex[line_idx][FIRST_JU], 1);
		
		if (has_moving_lines)
		{
			// Draw second hexagram
			line_str = line_str + "        ";
		
			line_str = line_str + second_hex[line_idx][SECOND_RELATION] + " ";
			line_str = line_str + rpad(second_hex[line_idx][SECOND_BRANCH], 2) + " ";
			line_str = line_str + center_string(second_hex[line_idx][SECOND_LINE], 3) + " ";
		}
		
		if (show_6_colors)
		{
			// Draw the colors
			line_str = line_str + "     ";
			line_str = line_str + first_hex[line_idx][FIRST_COLOR];
		}
			
		chart_str = chart_str + line_str + CRLF;	
	}

	// Draw 6 clash/6 combination/wandering gua/returning_gua
	chart_str = chart_str + CRLF;
	chart_str = chart_str + "      " + rpad(first_hex[7], 17);

	if (has_moving_lines)
		chart_str = chart_str + " " + second_hex[7];
		
	chart_str = chart_str + CRLF;
	
	return chart_str;
}

	for (var line_idx = 1; line_idx <= 6; ++line_idx)

		second_hex[line_idx][SECOND_LINE] = first_hex[line_idx][FIRST_LINE]
		
		if (second_hex[line_idx][SECOND_LINE] == 'X')
			second_hex[line_idx][SECOND_LINE] = "-";
			
		if (second_hex[line_idx][SECOND_LINE] == 'O')
			second_hex[line_idx][SECOND_LINE] = "- -";					
	}
	
	// Build first hexagram binary, and find if the hexagram has moving lines
	first_hex_binary = "";
	has_moving_lines = false;
	for (var line_idx = 1; line_idx <= 6; ++line_idx)
	{
		switch (first_hex[line_idx][FIRST_LINE])
		{
			case "-":
				first_hex_binary = first_hex_binary + "1";
				break;
				
			case "- -":
				first_hex_binary = first_hex_binary + "0";
				break;
				
			case "O":
				first_hex_binary = first_hex_binary + "1";
				has_moving_lines = true;
				break;
				
			case "X":
				first_hex_binary = first_hex_binary + "0";
				has_moving_lines = true;
				break;
		}
	}

	// Build second hexagram binary
	second_hex_binary = "";
	for (var line_idx = 1; line_idx <= 6; ++line_idx)
		if (second_hex[line_idx][SECOND_LINE] == "-")
			second_hex_binary = second_hex_binary + "1";
		else
			second_hex_binary = second_hex_binary + "0";

	// Get hexagram numbers and names
	for (var idx = 0; idx < 64; ++idx)
	{
		if (first_hex_binary == hexagrams[idx][HEX_BINARY])
			first_hex[0] = hexagrams[idx][HEX_NAME] + " - " + hexagrams[idx][HEX_NUMBER];

		if (second_hex_binary == hexagrams[idx][HEX_BINARY])
			second_hex[0] = hexagrams[idx][HEX_NAME] + " - " + hexagrams[idx][HEX_NUMBER];
	}
	
	// Assign branches to the lines
	for (var idx = 0; idx < 8; ++idx)
	{
		// First hex, lower trigram
		if (first_hex_binary.substring(0, 3) == branch_assignments[idx][0].substring(0, 3))

			first_hex[1][FIRST_BRANCH] = branch_assignments[idx][1];

		}

		if (first_hex_binary.substring(3, 6) == branch_assignments[idx][0].substring(3, 6))
		{
			first_hex[4][FIRST_BRANCH] = branch_assignments[idx][4];
			first_hex[5][FIRST_BRANCH] = branch_assignments[idx][5];
			first_hex[6][FIRST_BRANCH] = branch_assignments[idx][6];

			second_hex[1][SECOND_BRANCH] = branch_assignments[idx][1];
			second_hex[2][SECOND_BRANCH] = branch_assignments[idx][2];
			second_hex[3][SECOND_BRANCH] = branch_assignments[idx][3];

			break;

			break;

		case " CC": 
			first_hex_j_line = 4; 
			break;

		case "C  ":

		case "C C":

		case " C ":

	first_hex_u_line = first_hex_j_line - 3;

	first_hex_palace = get_palace(first_hex_binary, first_hex_j_line, (first_hex[7] == "Returning Gua"));

	{
		first_hex[line_idx][FIRST_RELATION] = get_relation(palace_element, first_hex[line_idx][FIRST_BRANCH]);
		second_hex[line_idx][SECOND_RELATION] = get_relation(palace_element, second_hex[line_idx][SECOND_BRANCH]);
	}

	// Find hidden elements and relations
	var missing_element = new Array(5);
	missing_element[WATER] = true;
	missing_element[WOOD] = true;
	missing_element[FIRE] = true;
	missing_element[EARTH] = true;
	missing_element[METAL] = true;
	
	for (var line_idx = 1; line_idx <= 6; ++line_idx)
		missing_element[get_branch_element(first_hex[line_idx][FIRST_BRANCH])] = false;

	for (var element = 0; element < 5; ++element)
		if (missing_element[element])
		{
			// Find the missing element in the palace hexagram
			for (var line_idx = 1; line_idx <= 6; ++line_idx)
				if (element == get_branch_element(branch_assignments[first_hex_palace][line_idx]))
				{
					first_hex[line_idx][FIRST_H_BRANCH] = branch_assignments[first_hex_palace][line_idx];
					first_hex[line_idx][FIRST_H_RELATION] = get_relation(palace_element, first_hex[line_idx][FIRST_H_BRANCH]);
				}
		}
	
	// Figure out if the second hexagram is returning gua or wandering gua
	second_hex_changes = get_changes(second_hex_binary);
	
	if (second_hex_changes == "C C")
		second_hex[7] = "wandering Gua";
	else if (second_hex_changes == " C ")
		second_hex[7] = "Returning Gua";

	// Figure out if the hexagrams are 6 combination or 6 clash
	if (is_combine(first_hex[1][FIRST_BRANCH], first_hex[4][FIRST_BRANCH]))
		first_hex[7] = "6 Combination";
	else if (is_strike(first_hex[1][FIRST_BRANCH], first_hex[4][FIRST_BRANCH]))
		first_hex[7] = "6 Clash";

	if (is_combine(second_hex[1][SECOND_BRANCH], second_hex[4][SECOND_BRANCH]))
		second_hex[7] = "6 Combination";
	else if (is_strike(second_hex[1][SECOND_BRANCH], second_hex[4][SECOND_BRANCH]))
		second_hex[7] = "6 Clash";	

	// Figure out the colors
	for (var stem_idx = 0; stem_idx < 10; ++stem_idx)
		if (day_stem == stems[stem_idx][0])
		{
			var color_idx;
			
			for (color_idx = 0; color_idx < 6; ++color_idx)
				if (colors[color_idx] == stems[stem_idx][1])
					break;
					
			for (var line_idx = 1; line_idx <= 6; ++line_idx)
			{
				first_hex[line_idx][FIRST_COLOR] = colors[color_idx];
				color_idx = (color_idx + 1) % 6;
			}
			
			break;
		}
	
	// Create and display the complete chart
	output_str = time_str + CRLF;
	output_str = output_str + CRLF;
	output_str = output_str + build_chart(has_moving_lines, form.chkShow6Colors.checked);

	form.txtHexagram.value = output_str;
}

// Set Western calender selections to the current date
function set_to_today(form)
{
	var idx;
	var today = new Date();

	idx = today.getFullYear() - form.cboWesternYear.options[0].value;
	form.cboWesternYear.selectedIndex = idx;
	form.cboWesternYear.options[idx].defaultSelected = true;
	
	idx = today.getMonth();
	form.cboWesternMonth.selectedIndex = idx;
	form.cboWesternMonth.options[idx].defaultSelected = true;

	idx = today.getDate() - 1;
	form.cboWesternDay.selectedIndex = idx;
	form.cboWesternDay.options[idx].defaultSelected = true;
}

// Convert user selected Western date to Chinese date.
// The time algorithm used here can have error of up to a few hours.
function convert_date(form)
{
	var		date_str = "";
	var		sel_date, diff;
	var		this_new_year, prev_new_month, next_new_month;
	var		year_sexagenary, day_sexagenary, month_branch;

	// Convert user selected date into a date object
	date_str = date_str + (form.cboWesternDay.selectedIndex + 1) + " ";
	date_str = date_str + form.cboWesternMonth.options[form.cboWesternMonth.selectedIndex].value + " ";
	date_str = date_str + form.cboWesternYear.options[form.cboWesternYear.selectedIndex].value + " ";
	date_str = date_str + "23:59:00 UTC";
	
	sel_date = new Date(date_str);
	
	// Calculate the year sexagenary cycle number
	diff = new Date(sel_date.valueOf() - ORIGIN_TIME.valueOf());
	year_sexagenary = Math.floor(diff.valueOf() / ONE_YEAR) % 60;

	// Calculate the start time of the new year for the user selected year
	this_new_year = new Date(ORIGIN_TIME.valueOf() + Math.floor(diff.valueOf() / ONE_YEAR) * ONE_YEAR);
	if (days_diff(this_new_year, month_start_2002[0]) == 0)
		// This corrects an calculation error for 2002
		this_new_year = month_start_2002[0];

	// Calculate the day sexagenary cycle number
	diff = new Date(sel_date.valueOf() - ORIGIN_DATE.valueOf());
	day_sexagenary = (Math.floor(diff.valueOf() / ONE_DAY) + 50) % 60;
	
	//   Calculate the month branch number by comparing the starting time of every month
	// against the user selected date
	next_new_month = this_new_year;
	for (month_branch = 0; month_branch < 12; ++month_branch)
	{
		prev_new_month = next_new_month;
		
		next_new_month = new Date(next_new_month.valueOf() + month_lengths[month_branch]);

		if (sel_date < next_new_month)
			break;
	}
	month_branch = (month_branch + 2) % 12;

	// Set the Chinese date selection boxes to the Chinese date
	form.cboYear.selectedIndex = (year_sexagenary % 12) + 1;
	form.cboMonth.selectedIndex = month_branch;
	form.cboDayBranch.selectedIndex = (day_sexagenary % 12);
	form.cboDayStem.selectedIndex = (day_sexagenary % 10);
	
	// Alert the user if the date is near a new month
	if (days_diff(sel_date, prev_new_month) <= 1 || days_diff(sel_date, next_new_month) <= 1)
		alert("The date is close to a change of month.  Please consult the Chinese calendar for the accurate month branch.");
}
