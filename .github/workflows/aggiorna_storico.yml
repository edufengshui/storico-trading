name: Aggiorna lo storico dei prezzi
on:
  workflow_dispatch:
  push:
    paths:
      - 'aggiorna_storico.txt'
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node aggiorna_storico.js
      - name: Salva nell'archivio
        run: |
          git config user.name "aggiorna-storico"
          git config user.email "aggiorna-storico@users.noreply.github.com"
          git add history_full_1h_f.zip
          git diff --cached --quiet || git commit -m "Storico prezzi aggiornato al $(date -u +%F)"
          git push
